<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search</title>
<script>try { if (localStorage.getItem("jobs-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f17; --panel: #131a26; --panel2: #1a2333; --panel-end: #10161f; --line: #243047; --line-soft: #202a3d;
    --text: #e6edf7; --muted: #8b98ad; --accent: #7c9cff; --good: #22c55e; --warn: #f59e0b; --bad: #ef4444;
    --glow: #1b2440; --track: #0d131d; --input: #0f1520;
    --grid: #1e2839; --axis: #34425c; --hover: rgba(124, 156, 255, .08);
    /* categorical series (validated against the panel surface #131a26) */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s-other: #5d6b82;
    --st1: #86b6ef; --st2: #6da7ec; --st3: #5598e7; --st4: #3987e5; --st5: #2a78d6;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f5f9; --panel: #ffffff; --panel2: #f2f5fa; --panel-end: #fbfcfe; --line: #dde3ec; --line-soft: #e8ecf2;
    --text: #0f1724; --muted: #5b6678; --accent: #3b5bdb; --good: #15803d; --warn: #b45309; --bad: #dc2626;
    --glow: #dfe7fb; --track: #eef2f7; --input: #ffffff;
    --grid: #e9edf3; --axis: #c3cbd8; --hover: rgba(59, 91, 219, .07);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s-other: #a3acba;
    --st1: #86b6ef; --st2: #5598e7; --st3: #2a78d6; --st4: #1c5cab; --st5: #104281;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: radial-gradient(1200px 600px at 10% -10%, var(--glow) 0%, var(--bg) 55%); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; min-height: 100vh; }
  a { color: var(--accent); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); }
  .hdr-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel2);
          border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .navbtn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer;
            font: inherit; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .navbtn:hover { border-color: var(--accent); }
  .navbtn.on { border-color: var(--accent); background: var(--hover); }
  .grid { display: grid; gap: 16px; }
  .card { background: linear-gradient(180deg, var(--panel) 0%, var(--panel-end) 100%); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .card h2 .h-note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-head h2 { margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 26px; }
  code { font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 14px; cursor: pointer;
                 border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .tabs .alert { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .view { display: none; }
  .view.on { display: block; }

  /* KPI tiles */
  .kpis { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
  .kpi .val { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .kpi .val small { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  .kpi .row2 { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: 6px; }
  .kpi .row2 > div:first-child { min-width: 0; }
  .kpi .row2 > div:last-child { flex: 0 0 auto; }
  .delta { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
  .spark { display: block; }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--panel2);
            border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
  .banner b { color: var(--text); }
  .banner.warn { border: 1px solid var(--warn); border-style: solid; background: color-mix(in srgb, var(--warn) 9%, var(--panel)); color: var(--text); }
  .banner .ic { font-size: 16px; line-height: 1.2; }
  .changed { padding: 12px 14px; border-radius: 12px; background: var(--hover); border: 1px solid var(--line); font-size: 13.5px; }
  .changed b { font-weight: 600; }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel2); }
  .seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12.5px; padding: 5px 11px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #0b0f17; font-weight: 600; }
  :root[data-theme="light"] .seg button[aria-pressed="true"] { color: #fff; }
  .seg button[aria-pressed="true"] .muted { color: inherit; opacity: .7; }
  .g-2 { grid-template-columns: 1.45fr 1fr; }
  .g-2b { grid-template-columns: 1fr 1fr; }
  @media (max-width: 1000px) { .g-2, .g-2b { grid-template-columns: 1fr; } }

  /* charts */
  .chart { display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .chart text.tick { font-variant-numeric: tabular-nums; }
  .chart text.lbl { fill: var(--text); font-size: 12px; }
  .chart text.val { fill: var(--text); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart text.ptitle { fill: var(--text); font-size: 12px; font-weight: 600; }
  .chart text.mark { fill: var(--muted); font-size: 10.5px; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart .hit:hover, .chart .hit:focus-visible { fill: var(--hover); }
  .chart .xh { stroke: var(--muted); stroke-width: 1; opacity: .6; }
  .chart .marker { stroke: var(--axis); stroke-width: 1; }
  .chart-wrap { position: relative; min-height: 40px; }
  .legend { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend i.ln { height: 2px; width: 14px; border-radius: 1px; }
  .tbl-toggle { font-size: 12px; padding: 3px 9px; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .mini-table th, .mini-table td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .mini-table th:first-child, .mini-table td:first-child { text-align: left; }
  .mini-table th { color: var(--muted); font-weight: 600; }
  .scroll-x { overflow-x: auto; }

  .tip { position: fixed; z-index: 60; pointer-events: none; display: none; min-width: 150px; max-width: 280px; background: var(--panel2);
         border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .tip .t { color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
  .tip .k { width: 12px; height: 2px; border-radius: 1px; flex: 0 0 auto; }
  .tip .v { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 26px; }
  .tip .l { color: var(--muted); }
  .tip .f { color: var(--muted); margin-top: 5px; border-top: 1px solid var(--line); padding-top: 5px; }

  /* badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px 1px 6px; border-radius: 999px;
           border: 1px solid var(--line); background: var(--panel2); white-space: nowrap; color: var(--text); }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .badge.open { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .badge.closed { color: var(--muted); }
  .badge.applied { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .appcard .badge.attn { white-space: normal; border-radius: 9px; }
  .badge.attn { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel2)); font-weight: 600; }
  .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .chipbtn { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2);
             color: var(--muted); cursor: pointer; white-space: nowrap; }
  .chipbtn:hover { border-color: var(--accent); color: var(--text); }
  .chipbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0f17; font-weight: 600; }
  :root[data-theme="light"] .chipbtn[aria-pressed="true"] { color: #fff; }
  .chipbtn .n { opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; }

  /* jobs */
  .fbar { display: grid; gap: 10px; }
  .frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 320px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 34px; font-size: 14px; }
  .search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input, select { font: inherit; font-size: 13px; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  input:focus, select:focus, button:focus-visible, .chart .hit:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="date"] { padding: 5px 7px; }
  label.fl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .tagrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .resline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 2px 8px; color: var(--muted); font-size: 12.5px; }
  .resline b { color: var(--text); }
  table.jobs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.jobs th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
                  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  table.jobs th button { all: unset; cursor: pointer; }
  table.jobs th button:hover { color: var(--text); }
  table.jobs th .arr { color: var(--accent); margin-left: 3px; }
  table.jobs td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.jobs tbody tr { cursor: pointer; }
  table.jobs tbody tr:hover { background: var(--hover); }
  table.jobs tbody tr.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
  table.jobs .t1 { font-weight: 600; }
  table.jobs .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.jobs .date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  table.jobs tr.closed .t1 { color: var(--muted); }
  .tablebox { overflow: auto; max-height: 72vh; border-radius: 12px; border: 1px solid var(--line); }
  @media (max-width: 860px) { .hide-sm { display: none; } }
  .co-sm { display: none; color: var(--muted); font-size: 12px; margin-top: 1px; }
  @media (max-width: 600px) { .hide-xs { display: none; } .co-sm { display: block; } table.jobs td, table.jobs th { padding: 8px 7px; } }
  .more { display: flex; justify-content: center; padding: 14px; }

  /* drawer */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; }
  .drawer-bg.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); z-index: 41; background: var(--panel); border-left: 1px solid var(--line);
            transform: translateX(105%); transition: transform .18s ease; overflow-y: auto; padding: 22px 24px 40px; box-shadow: -16px 0 40px rgba(0,0,0,.35); }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 6px 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .drawer .co { font-size: 14px; color: var(--muted); }
  .drawer .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .drawer .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 14px 0; }
  .meta div { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .meta small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .meta span { overflow-wrap: anywhere; }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.6; background: var(--panel2); border: 1px solid var(--line);
          border-radius: 12px; padding: 14px 16px; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }

  /* applications */
  .g-apps { grid-template-columns: 1fr 1.3fr; }
  @media (max-width: 1000px) { .g-apps { grid-template-columns: 1fr; } }
  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat-row .s { min-width: 90px; }
  .stat-row .s .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-row .s .l { color: var(--muted); font-size: 12px; }
  .lanes { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; }
  .lanes .lane { flex: 1 0 215px; max-width: 340px; }
  .lanes .lane.none { flex: 0 0 120px; min-height: 0; }
  .appcard .badge { white-space: normal; }
  .lane { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
  .lane.muted { opacity: .82; }
  .lane-h { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; padding: 2px 4px 6px;
            border-bottom: 2px solid var(--line); }
  .lane-h .n { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .appcard { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; font-size: 12.5px; }
  .appcard.attn { border-color: var(--warn); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent) inset; }
  .appcard .co { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
  .appcard .ti { color: var(--text); margin: 1px 0 6px; overflow-wrap: anywhere; }
  .appcard .ln { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .appcard .bd { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .appcard details { margin-top: 7px; }
  .appcard summary { cursor: pointer; color: var(--accent); font-size: 12px; list-style: none; }
  .appcard summary::-webkit-details-marker { display: none; }
  .appcard .acts { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; }
  .appcard .acts button { all: unset; color: var(--accent); cursor: pointer; }
  .tl { border-left: 2px solid var(--line); margin: 8px 0 0 4px; padding-left: 12px; display: grid; gap: 9px; }
  .tl .ev { position: relative; }
  .tl .ev::before { content: ""; position: absolute; left: -18px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--ev, var(--muted));
                    box-shadow: 0 0 0 2px var(--panel); }
  .tl .ev .when { color: var(--muted); font-size: 11.5px; }
  .tl .ev .subj { font-weight: 600; overflow-wrap: anywhere; }
  .tl .ev .prev { color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
  .attn-list { display: grid; gap: 8px; }
  .attn-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
  .rate td .bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); min-width: 60px; }
  .rate td .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--s1); }
  table.rate { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.rate th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.rate td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
  table.rate th:first-child, table.rate td:first-child { text-align: left; white-space: normal; }
  table.rate tr.tot td { font-weight: 700; border-bottom: 0; }

  /* watch */
  table.runs { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.runs th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.runs td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
  table.runs td:nth-child(2) { white-space: normal; overflow-wrap: anywhere; color: var(--muted); }
  table.runs th:first-child, table.runs td:first-child, table.runs th:nth-child(2), table.runs td:nth-child(2) { text-align: left; }

  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state .big { font-size: 40px; margin-bottom: 8px; }
  .empty-state h3 { margin: 0 0 6px; font-size: 18px; }
  @media (max-width: 600px) { .wrap { padding: 18px 12px 40px; } .card { padding: 14px; border-radius: 14px; } .drawer { padding: 16px 16px 40px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Job Search</h1>
      <div class="sub" id="subtitle">Israel · Engineering Manager / Team Lead / Mobile Team Lead</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-right" id="pills"></div>
      <a class="navbtn" href="index.html" title="Learning dashboard">← Learning</a>
      <button class="navbtn" id="themeBtn" type="button" title="Switch light / dark">◐</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="market" aria-selected="true">Market</button>
    <button role="tab" data-tab="jobs" aria-selected="false">Jobs <span class="count" id="cnt-jobs"></span></button>
    <button role="tab" data-tab="apps" aria-selected="false">Applications <span class="count" id="cnt-apps"></span></button>
    <button role="tab" data-tab="watch" aria-selected="false">Watch <span id="watch-alert"></span></button>
  </nav>

  <main id="main">
    <section class="view" id="view-market" role="tabpanel"></section>
    <section class="view" id="view-jobs" role="tabpanel"></section>

<script>
// Decrypts jobs.json in the browser. The derived key (not the password) is kept in localStorage.
const LOCK_KEY = "career-learning-key";
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let dashKey = null;
async function fetchData() { return (await fetch("jobs.json?t=" + Date.now(), { cache: "no-store" })).json(); }
async function deriveKey(pw, d) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(d.salt), iterations: d.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function load(key, d) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(d.iv) }, key, b64d(d.ct));
  new Function(new TextDecoder().decode(pt))();
  document.getElementById("lock").style.display = "none";
  render();
}
async function savedKey() {
  const raw = localStorage.getItem(LOCK_KEY);
  return raw ? crypto.subtle.importKey("raw", b64d(raw), "AES-GCM", true, ["decrypt"]) : null;
}
async function refresh() { if (dashKey) { try { await load(dashKey, await fetchData()); } catch {} } }
document.getElementById("lockForm").onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById("lockErr");
  err.textContent = "";
  try {
    const d = await fetchData(), key = await deriveKey(document.getElementById("pw").value, d);
    await load(key, d);
    dashKey = key;
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    localStorage.setItem(LOCK_KEY, btoa(String.fromCharCode(...raw)));

};
window.addEventListener("load", async () => {
  try { const key = await savedKey(); if (key) { await load(key, await fetchData()); dashKey = key; } }
  catch { localStorage.removeItem(LOCK_KEY); }
  setInterval(refresh, 300000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
});
</script>

/* ---------- chart primitives (inline SVG, drawn at real pixel width) ---------- */
function niceScale(maxV, count = 4) {

function chartBlock(host, draw, table) {

    h("tbody", null, rows.map((r) => h("tr", null, r.map((c) => h("td", null, c))))));
}

// Stacked columns. weeks: [{label, key}], series: [{label, color, values}]
function stackedColumns(host, { cols, series, H = 240, marks = [], onCol, footFor }) {
  const W = widthOf(host), m = { l: 34, r: 6, t: 16, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b, n = cols.length;
  const totals = cols.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const { max, ticks } = niceScale(Math.max(...totals, 1));
  const y = (v) => m.t + ph - (v / max) * ph;
  const band = pw / n, bw = Math.min(24, Math.max(3, band * 0.64));
  const root = svg("svg", { class: "chart", width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Stacked column chart" });
  ticks.forEach((t) => {
    root.append(svg("line", { class: t === 0 ? "axis" : "grid", x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }));
    root.append(svg("text", { class: "tick", x: m.l - 7, y: y(t) + 3.5, "text-anchor": "end" }, compact(t)));
  });
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 58))));
  marks.forEach((mk) => {
    if (mk.index < 0 || mk.index >= n) return;
    const x = m.l + band * mk.index + 1;
    root.append(svg("line", { class: "marker", x1: x, x2: x, y1: m.t - 6, y2: m.t + ph }));
    root.append(svg("text", { class: "mark", x: x + 4, y: m.t - 2 }, mk.label));

    const cx = m.l + band * i + band / 2;
    let base = 0, first = true;
    const topIdx = series.map((s) => s.values[i] > 0).lastIndexOf(true);
    series.forEach((s, si) => {
      const v = s.values[i];
      if (!v) return;
      let top = y(base + v), bottom = y(base);

      `Total ${num(totals[i])}${footFor ? footFor(i) : ""}`]);
    if (onCol) { hit.addEventListener("click", () => onCol(i)); hit.addEventListener("keydown", (e) => { if (e.key === "Enter") onCol(i); }); }

// Small multiples of single-series lines sharing one x axis and one crosshair.
function lineMultiples(host, { cols, panels, PH = 74 }) {
  const W = widthOf(host), m = { l: 34, r: 44, t: 22, b: 24 }, gap = 32;
  const pw = W - m.l - m.r, n = cols.length, band = pw / n;
  const H = m.t + panels.length * PH + (panels.length - 1) * gap + m.b;
  const xAt = (i) => m.l + band * i + band / 2;
  const root = svg("svg", { class: "chart", width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Trend lines" });
  const dots = [];
  panels.forEach((p, pi) => {
    const top = m.t + pi * (PH + gap);
    const valid = p.values.filter((v) => v != null);
    const { max, ticks } = niceScale(Math.max(...valid, p.minMax || 1), 2);
    const y = (v) => top + PH - (v / max) * PH;
    root.append(svg("text", { class: "ptitle", x: m.l, y: top - 8 }, p.label));
    ticks.forEach((t) => {
      root.append(svg("line", { class: t === 0 ? "axis" : "grid", x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t) }));
      root.append(svg("text", { class: "tick", x: m.l - 7, y: y(t) + 3.5, "text-anchor": "end" }, p.fmt(t)));
    });
    const pts = p.values.map((v, i) => (v == null ? null : [xAt(i), y(v)]));
    let d = "", area = "", runStart = null;
    pts.forEach((pt, i) => {
      if (!pt) { if (runStart != null) { area += `L${pts[i - 1][0]},${y(0)}Z`; runStart = null; } return; }
      if (runStart == null) { d += `M${pt[0]},${pt[1]}`; area += `M${pt[0]},${y(0)}L${pt[0]},${pt[1]}`; runStart = i; }
      else { d += `L${pt[0]},${pt[1]}`; area += `L${pt[0]},${pt[1]}`; }
    });

      root.append(svg("path", { d: `M${pts[n1 - 1][0]},${pts[n1 - 1][1]}L${pts[n1][0]},${pts[n1][1]}`, style: "fill:none;stroke:var(--panel);stroke-width:3;stroke-linecap:round" }));
      root.append(svg("path", { d: `M${pts[n1 - 1][0]},${pts[n1 - 1][1]}L${pts[n1][0]},${pts[n1][1]}`, style: `fill:none;stroke:${p.color};stroke-width:2;stroke-linecap:round;opacity:.4` }));
    }
    const li = p.values.map((v) => v != null).lastIndexOf(true);
    if (li >= 0) {
      root.append(svg("circle", { cx: pts[li][0], cy: pts[li][1], r: 4, style: `fill:${p.color};stroke:var(--panel);stroke-width:2` }));
      root.append(svg("text", { class: "val", x: pts[li][0] + 8, y: pts[li][1] + 4 }, p.fmt(p.values[li])));
    }
    const dot = svg("circle", { r: 4, style: `fill:${p.color};stroke:var(--panel);stroke-width:2;display:none` });
    dots.push({ dot, pts });

  cols.forEach((c, i) => { if ((n - 1 - i) % every === 0) root.append(svg("text", { x: xAt(i), y: H - 7, "text-anchor": "middle" }, c.label)); });
  const xh = svg("line", { class: "xh", y1: m.t - 4, y2: H - m.b, style: "display:none" });
  root.append(xh);
  const overlay = svg("rect", { x: m.l, y: m.t, width: pw, height: H - m.t - m.b, style: "fill:transparent", tabindex: 0, "aria-label": "Hover for weekly values" });
  let cur = n - 1;
  const showAt = (i, e) => {
    cur = i;
    xh.setAttribute("x1", xAt(i)); xh.setAttribute("x2", xAt(i)); xh.style.display = "";
    dots.forEach(({ dot, pts }) => { if (pts[i]) { dot.setAttribute("cx", pts[i][0]); dot.setAttribute("cy", pts[i][1]); dot.style.display = ""; } else dot.style.display = "none"; });

  };
  const hideAll = () => { xh.style.display = "none"; dots.forEach(({ dot }) => (dot.style.display = "none")); tip.hide(); };

  });
  overlay.addEventListener("pointerleave", hideAll);
  overlay.addEventListener("focus", () => showAt(cur));
  overlay.addEventListener("blur", hideAll);

    if (e.key === "ArrowRight") { showAt(Math.min(n - 1, cur + 1)); e.preventDefault(); }
  });

// Horizontal bars, optionally stacked. rows: [{label, values: [..per series], title?}]
function hBars(host, { rows, series, onRow, foot }) {
  const W = widthOf(host, 420), rowH = 26, thick = 14;
  const labelW = Math.min(150, Math.round(W * 0.34)), valW = 40, m = { t: 2, b: 2 };
  const pw = W - labelW - valW - 8;
  const totals = rows.map((r) => r.values.reduce((a, b) => a + b, 0));
  const max = Math.max(...totals, 1);
  const H = m.t + rows.length * rowH + m.b;

  root.append(svg("line", { class: "axis", x1: labelW + 0.5, x2: labelW + 0.5, y1: 0, y2: H }));

/* ---------- model ---------- */
let M = null, lastGen = null;
const STAGES = [
  { key: "drafted", label: "Drafted", optional: true }, { key: "applied", label: "Applied" }, { key: "received", label: "Received" }, { key: "recruiter", label: "Screening" },
  { key: "assessment", label: "Assessment" }, { key: "interview", label: "Interview" }, { key: "offer", label: "Offer" },
];
const CLOSED_STAGES = [{ key: "rejected", label: "Rejected" }, { key: "noreply", label: "No reply" }, { key: "withdrawn", label: "Withdrawn" }];
const STAGE_LABEL = Object.fromEntries([...STAGES, ...CLOSED_STAGES].map((s) => [s.key, s.label]));
function normStatus(s) {
  const t = String(s || "").toLowerCase().trim();
  if (!t) return "applied";

  if (/offer/.test(t)) return "offer";
  if (/reject|declin(ed)? by|not (moving|selected)/.test(t)) return "rejected";
  if (/withdr|declin|cancel/.test(t)) return "withdrawn";
  if (/no[\s-]?reply|no[\s-]?response|ghost|silent/.test(t)) return "noreply";
  if (/interview|onsite|on-site|final/.test(t)) return "interview";
  if (/assess|assignment|home|test|exercise/.test(t)) return "assessment";
  if (/recruit|screen|phone|hr|call/.test(t)) return "recruiter";
  if (/receiv|confirm|ack/.test(t)) return "received";

}
const KIND_COLOR = { applied: "var(--muted)", received: "var(--st1)", recruiter: "var(--st3)", assessment: "var(--st4)", interview: "var(--st5)", offer: "var(--good)", rejection: "var(--bad)", other: "var(--axis)" };
const KIND_LABEL = { applied: "Sent", received: "Received", recruiter: "Recruiter", assessment: "Assessment", interview: "Interview", rejection: "Rejection", offer: "Offer", other: "Other" };
const REPLY_KINDS = new Set(["recruiter", "assessment", "interview", "rejection", "offer"]);

function buildModel(d) {
  const ref = parseTime(d.generatedAt) || new Date();
  const refDay = parseDay(ymd(ref));
  const jobs = Array.isArray(d.jobs) ? d.jobs : [];
  const byId = new Map();
  const appByJob = new Map();
  const apps = Array.isArray(d.applications) ? d.applications : null;
  (apps || []).forEach((a) => { if (a.jobId) appByJob.set(a.jobId, a); });
  jobs.forEach((j) => {
    j.tags = Array.isArray(j.tags) ? j.tags : [];
    j.queries = Array.isArray(j.queries) ? j.queries : [];
    j._hay = [j.title, j.company, j.location, j.description].map((s) => String(s || "")).join("\n").toLowerCase();
    j._date = j.posted || j.firstSeen || null;
    const dd = parseDay(j._date);
    j._wk = dd ? ymd(weekStart(dd)) : null;
    j._fs = parseDay(j.firstSeen);
    j._app = j.applicationId != null || appByJob.has(j.id);
    j._lead = !!j.isLead;
    j._mob = !!j.isMobile;
    j._dup = !!j.dupOf;
    j._srcs = Array.isArray(j.sources) && j.sources.length ? j.sources : [j.source].filter(Boolean);
    byId.set(j.id, j);
  });
  const dupsOf = new Map();
  jobs.forEach((j) => { if (j._dup) { const l = dupsOf.get(j.dupOf) || []; l.push(j); dupsOf.set(j.dupOf, l); } });
  const uniq = jobs.filter((j) => !j._dup);

  const trackStart = runs.length ? parseDay(ymd(runs[0]._t)) : parseDay(firstSeenMin);

    const events = (Array.isArray(a.events) ? a.events : []).map((e) => ({ ...e, _t: parseTime(e.date) })).sort((x, y) => (x._t || 0) - (y._t || 0));
    const stage = normStatus(a.inLog === false ? a.emailStatus || a.status : a.status);
    const job = a.jobId ? byId.get(a.jobId) : null;
    const replied = events.some((e) => REPLY_KINDS.has(e.kind)) || ["recruiter", "assessment", "interview", "offer", "rejected"].includes(stage);
    const interviewed = events.some((e) => e.kind === "interview") || ["interview", "offer"].includes(stage);

    emailScannedAt: parseTime(d.meta && d.meta.emailScannedAt) };
}

function whatChanged() {
  const J = M.uniq.filter(locOk);
  const wk = J.filter((j) => inLastDays(j.firstSeen, 7)), prev = J.filter((j) => inLastDays(j.firstSeen, 7, 7));
  const parts = [];
  const lead = wk.filter((j) => j._lead), mob = wk.filter((j) => j.category === "mobile-lead");
  const prevOk = M.trackStart && addDays(M.refDay, -14) >= M.trackStart;
  let p1 = `${plural(wk.length, "new role")} (${num(lead.length)} lead)`;
  if (prevOk) {
    const pl = prev.filter((j) => j._lead).length, dl = lead.length - pl;
    p1 += dl === 0 ? ", same lead count as last week" : `, ${Math.abs(dl)} ${dl > 0 ? "more" : "fewer"} lead roles than last week`;
  } else p1 += ", first full week of tracking";
  parts.push(p1);
  if (mob.length) {
    const cos = [...new Set(mob.map((j) => j.company).filter(Boolean))];
    parts.push(`${plural(mob.length, "mobile lead role")}: ${cos.slice(0, 4).join(", ")}${cos.length > 4 ? ` +${cos.length - 4}` : ""}`);
  } else parts.push("no new mobile lead roles");
  const closed = J.filter((j) => !j.open && j.closedAt && inLastDays(j.closedAt, 7));
  if (closed.length) parts.push(`${num(closed.length)} closed (${num(closed.filter((j) => j._lead).length)} lead)`);
  // biggest rise in tag share among lead roles: this week vs the 4 weeks before
  const base = J.filter((j) => j._lead && inLastDays(j.firstSeen, 28, 7) && j.tags.length);
  const now = lead.filter((j) => j.tags.length);
  if (now.length >= 8 && base.length >= 20) {
    let best = null;
    TAGS.forEach((t) => {
      const a = now.filter((j) => j.tags.includes(t)).length / now.length, b = base.filter((j) => j.tags.includes(t)).length / base.length;
      if (a - b > 0.05 && (!best || a - b > best.d)) best = { t, a, b, d: a - b };
    });
    if (best) parts.push(`${tagLabel(best.t)} up in lead roles (${Math.round(best.b * 100)}% → ${Math.round(best.a * 100)}%)`);
  }
  const co = new Map();
  lead.forEach((j) => co.set(j.company, (co.get(j.company) || 0) + 1));
  const top = [...co.entries()].sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] >= 2) parts.push(`most active: ${top[0]} (${top[1]} lead roles)`);
  return parts.join(" · ") + ".";
}

  summary.body.append(h("div", { class: "stat-row" },
    stat(num(A.length), "applied"), stat(num(active), "still active"), stat(pct(replied, A.length), `got a reply (${num(replied)})`),
    stat(pct(inter, A.length), `reached interview (${num(inter)})`)));
  if (attn.length) {
    const attnItem = (a) => h("div", { class: "attn-item" },
      h("span", { class: "badge attn" }, "⚠ Needs your OK"),
      h("div", null, h("b", null, a.company || "—"), " · ", a.title || "",
        h("div", { class: "note" }, a.inLog === false ? "Found only in email, not in applications.md yet. Add it with /job-apply." :
          `The log says “${STAGE_LABEL[normStatus(a.status)] || a.status}”, email suggests “${STAGE_LABEL[normStatus(a.suggestedStatus)] || a.suggestedStatus}”. Update applications.md if that's right.`)));
    const sorted = attn.slice().sort((x, y) => (x.inLog === false) - (y.inLog === false) || lastEventDate(y).localeCompare(lastEventDate(x)));
    const SHOW = 4;
    summary.body.append(h("div", { class: "sec" }, `Needs your OK (${attn.length})`), h("div", { class: "attn-list" }, sorted.slice(0, SHOW).map(attnItem)),
      sorted.length > SHOW ? h("details", { style: "margin-top:8px" }, h("summary", { class: "navbtn", style: "list-style:none;display:inline-flex" }, `Show ${sorted.length - SHOW} more`),
        h("div", { class: "attn-list", style: "margin-top:8px" }, sorted.slice(SHOW).map(attnItem))) : null);
  }
  const rate = card("Response rate by role category", "applied → any reply → interview");
  rate.body.append(rateTable(A));
  rate.body.append(h("div", { class: "note" }, "A reply means the company answered: a recruiter, an assessment, an interview or a rejection. An automatic “application received” does not count."));
  v.append(h("div", { class: "grid g-apps" }, summary.el, rate.el));

  const lanes = (defs, muted) => h("div", { class: "lanes", style: "margin-top:12px" }, defs.filter((s) => !s.optional || all.some((a) => a.stage === s.key)).map((s, i) => {
    const items = all.filter((a) => a.stage === s.key).sort((x, y) => (lastEventDate(y) || "").localeCompare(lastEventDate(x) || ""));
    return h("div", { class: "lane" + (muted ? " muted" : "") + (items.length ? "" : " none") },
      h("div", { class: "lane-h", style: `border-bottom-color:${muted ? (s.key === "rejected" ? "var(--bad)" : "var(--axis)") : s.key === "offer" ? "var(--good)" : `var(--st${Math.min(5, i + 1)})`}` },
        h("span", null, s.label), h("span", { class: "n" }, String(items.length))),
      items.length ? items.map(appCard) : h("div", { class: "empty", style: "font-size:12px;padding:4px" }, "—"));
  }));
  const pipe = card("Pipeline", "latest status per application");
  pipe.body.append(lanes(STAGES, false));
  pipe.body.append(h("div", { class: "sec", style: "margin-top:20px" }, "Closed"), lanes(CLOSED_STAGES, true));
  pipe.el.style.marginTop = "16px";
  v.append(pipe.el);

  if (M.emails.length) {
    const em = card("Other job emails", `${num(M.emails.length)} that match no application`);
    em.body.append(h("div", { class: "tl" }, M.emails.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))).slice(0, 40).map(eventEl)));
    em.el.style.marginTop = "16px";
    v.append(em.el);
  }
}
const lastEventDate = (a) => (a.events.length ? String(a.events[a.events.length - 1].date || "") : a.date || "");
function stat(v, l) { return h("div", { class: "s" }, h("div", { class: "v" }, v), h("div", { class: "l" }, l)); }
function rateTable(A) {
  const by = new Map();
  A.forEach((a) => {
    const k = a._cat ? catLabel(a._cat) : "No matched posting";
    const e = by.get(k) || { n: 0, r: 0, i: 0, order: a._cat ? CATS.indexOf(a._cat) : 99 };
    e.n++; if (a.replied) e.r++; if (a.interviewed) e.i++;
    by.set(k, e);
  });
  const rows = [...by.entries()].sort((a, b) => a[1].order - b[1].order);
  const tot = { n: A.length, r: A.filter((a) => a.replied).length, i: A.filter((a) => a.interviewed).length };
  const bar = (a, b) => h("div", { class: "bar", title: pct(a, b) }, h("i", { style: `width:${b ? (a / b) * 100 : 0}%` }));
  const tr = (label, e, cls) => h("tr", { class: cls || "" }, h("td", null, label), h("td", null, num(e.n)),
    h("td", null, `${num(e.r)} · ${pct(e.r, e.n)}`), h("td", { class: "hide-sm" }, bar(e.r, e.n)), h("td", null, `${num(e.i)} · ${pct(e.i, e.n)}`), h("td", { class: "hide-sm" }, bar(e.i, e.n)));
  return h("div", { class: "scroll-x" }, h("table", { class: "rate" },
    h("thead", null, h("tr", null, h("th", null, "Role category"), h("th", null, "Applied"), h("th", null, "Any reply"), h("th", { class: "hide-sm" }), h("th", null, "Interview"), h("th", { class: "hide-sm" }))),
    h("tbody", null, rows.map(([k, e]) => tr(k, e)), tr("All", tot, "tot"))));
}
function appCard(a) {
  const last = a.events[a.events.length - 1];
  const url = safeUrl(a.link);
  const days = Math.round((M.refDay - parseDay(a.date)) / DAY);
  const badges = [];
  if (a.suggestedStatus) badges.push(h("span", { class: "badge attn", title: "Email disagrees with the log" }, `⚠ Needs your OK: email says ${STAGE_LABEL[normStatus(a.suggestedStatus)] || a.suggestedStatus}`));
  if (a.inLog === false) badges.push(h("span", { class: "badge attn", title: "Found only in email" }, "⚠ Needs your OK: only in email"));
  if (a.cv) badges.push(h("span", { class: "badge" }, "CV: " + a.cv));
  if (a._cat) badges.push(catBadge(a._cat));
  const acts = [];
  if (a.job) acts.push(h("button", { type: "button", onclick: () => go({ tab: "jobs", job: a.job.id }) }, "View posting"));
  if (url) acts.push(h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, "Link ↗"));
  return h("div", { class: "appcard" + (a.attn ? " attn" : "") },
    h("div", { class: "co" }, a.company || "—"),
    h("div", { class: "ti" }, a.title || ""),
    h("div", { class: "ln" }, `Applied ${fmtDay(a.date)}${days >= 0 ? ` · ${days === 0 ? "today" : days + "d ago"}` : ""}`),
    last ? h("div", { class: "ln", style: "margin-top:3px" }, h("span", { style: "color:var(--text)" }, `${KIND_LABEL[last.kind] || last.kind} · ${fmtDay(String(last.date || "").slice(0, 10))}`), last.subject ? ` — ${last.subject}` : "") : null,
    a.nextStep ? h("div", { class: "ln", style: "margin-top:3px" }, "Next: ", h("span", { style: "color:var(--text)" }, a.nextStep)) : null,
    a.followUp ? h("div", { class: "ln" }, "Follow up: " + a.followUp) : null,
    badges.length ? h("div", { class: "bd" }, badges) : null,
    a.events.length ? h("details", null, h("summary", null, `▸ ${plural(a.events.length, "email")}`), h("div", { class: "tl" }, a.events.slice().reverse().map(eventEl))) : null,
    acts.length ? h("div", { class: "acts" }, acts) : null);
}
function eventEl(e) {
  const el = h("div", { class: "ev" },
    h("div", { class: "when" }, `${KIND_LABEL[e.kind] || e.kind || "Email"} · ${e.date || ""}`),
    e.subject ? h("div", { class: "subj" }, e.subject) : null,
    e.from ? h("div", { class: "when" }, e.from) : null,
    e.preview ? h("div", { class: "prev" }, e.preview) : null);
  el.style.setProperty("--ev", KIND_COLOR[e.kind] || "var(--muted)");
  return el;
}

/* ---------- Watch ---------- */
function renderWatch() {
  const v = $("view-watch");
  v.textContent = "";
  const R = M.runs, now = new Date();
  const last = R.length ? R[R.length - 1] : null;
  const hrs = last ? (now - last._t) / 3600e3 : Infinity;
  if (hrs > 8) {
    v.append(h("div", { class: "banner warn", style: "margin-bottom:16px" }, h("span", { class: "ic" }, "⚠️"), h("div", null,
      h("b", null, last ? `No run in ${Math.round(hrs)} hours.` : "No runs recorded yet."),
      " The watcher normally runs every few hours. Check that the job-watch LaunchAgent is loaded and that the Mac was awake.")));
  }
  const in24 = R.filter((r) => now - r._t < DAY), in7 = R.filter((r) => now - r._t < 7 * DAY);
  const sum = (rs, k) => rs.reduce((a, r) => a + (+r[k] || 0), 0);
  v.append(h("div", { class: "grid kpis" },
    kpi("Last run", last ? ago(last._t, now) : "never", last ? `${fmtTime(last._t)} · ${last.kind || "run"}` : "", null,
      null),
    kpi("Runs in 24h", num(in24.length), `${num(sum(in24, "requests"))} requests · ${num(sum(in24, "results"))} results`, null, null),
    kpi("New roles in 24h", num(sum(in24, "newJobs")), `${num(sum(in7, "newJobs"))} in the last 7 days`, null, null),
    kpi("Throttled", num(sum(in7, "throttled")), `requests blocked in 7 days · ${num(in7.filter((r) => r.throttled > 0).length)} runs hit it`, null, null)));
  if (hrs <= 8) v.lastChild.firstChild.querySelector(".val").prepend(h("span", { style: "color:var(--good);font-size:18px;vertical-align:middle;margin-right:6px", title: "Running on schedule" }, "●"));

  // per-day activity, last 14 days
  const today = parseDay(ymd(now));
  const cols = [];
  for (let i = 13; i >= 0; i--) { const d = addDays(today, -i); cols.push({ key: ymd(d), label: fmtDay(d), partial: i === 0, title: d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + (i === 0 ? " (so far)" : "") }); }
  const idx = new Map(cols.map((c, i) => [c.key, i]));
  const newJobs = cols.map(() => 0), runsN = cols.map(() => 0), thr = cols.map(() => 0);
  R.forEach((r) => { const i = idx.get(ymd(r._t)); if (i != null) { newJobs[i] += +r.newJobs || 0; runsN[i]++; thr[i] += +r.throttled || 0; } });
  const c1 = card("New roles found per day", "last 14 days · hover for runs and throttling");
  const b1 = chartBlock(c1.body, (box) => stackedColumns(box, { cols, series: [{ label: "new roles", color: "var(--s1)", values: newJobs }], H: 200,
    footFor: (i) => ` · ${plural(runsN[i], "run")}${thr[i] ? ` · ⚠ ${thr[i]} throttled` : ""}` }),
  () => miniTable(["Day", "Runs", "New roles", "Throttled"], cols.map((c, i) => [c.title, num(runsN[i]), num(newJobs[i]), num(thr[i])])));
  c1.tools.append(tableBtn(b1));

  const c2 = card("Run history", `${plural(R.length, "run")} saved · newest first`);
  const rows = R.slice(-60).reverse();
  c2.body.append(R.length ? h("div", { class: "scroll-x", style: "max-height:420px;overflow:auto" }, h("table", { class: "runs" },
    h("thead", null, h("tr", null, ["When", "Kind", "Requests", "Results", "New", "Throttled"].map((t) => h("th", null, t)))),
    h("tbody", null, rows.map((r) => h("tr", null, h("td", { title: r.at }, fmtTime(r._t)), h("td", null, r.kind || "—"), h("td", null, num(r.requests)),
      h("td", null, num(r.results)), h("td", null, r.newJobs ? h("b", null, num(r.newJobs)) : "0"),
      h("td", null, r.throttled ? h("span", { class: "badge bad" }, "⚠ " + num(r.throttled)) : h("span", { class: "muted" }, "0"))))))) : h("div", { class: "empty" }, "No runs recorded yet."));
  if (R.length > 60) c2.body.append(h("div", { class: "note" }, `Showing the latest 60 of ${num(R.length)} runs.`));
  v.append(h("div", { class: "grid g-2b", style: "margin-top:16px" }, c1.el, c2.el));
}

/* ---------- wiring ---------- */
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => { if (S.tab !== b.dataset.tab) go({ tab: b.dataset.tab, job: b.dataset.tab === "jobs" ? S.job : "" }); }));
function onNav() { const hs = location.hash || "#"; if (hs === lastHash) return; lastHash = hs; readHash(); if (M) { showTab(); } }
window.addEventListener("hashchange", onNav);
window.addEventListener("popstate", onNav);
let rsz = null, lastW = innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (innerWidth === lastW) return; lastW = innerWidth; if (M && (S.tab === "market" || S.tab === "watch")) showTab(); }, 150);
});
$("themeBtn").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("jobs-theme", light ? "light" : "dark"); } catch (e) {}
});
readHash();
lastHash = location.hash || "#";

// Local copy: re-load jobs-data.js now and then so a new export shows up without a manual reload.
function startLocalRefresh() {
  setInterval(() => {
    const s = document.createElement("script");
    s.src = "jobs-data.js?t=" + Date.now();
    s.onload = () => { s.remove(); render(); };
    s.onerror = () => s.remove();
    document.body.appendChild(s);
  }, 300000);
}

</script>
